[package]
name = "slimblade"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Userspace button and scroll manager for Kensington SlimBlade trackballs on Linux"
license = "MIT"
repository = "https://github.com/ioloryn/slimblade"
documentation = "https://github.com/ioloryn/slimblade#readme"
categories = ["command-line-utilities", "hardware-support"]
keywords = ["kensington", "slimblade", "trackball", "evdev", "uinput"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
evdev = "0.13"
# Default `tokio` feature conflicts with zbus/async-io coming from accesskit:
# zbus ends up with both runtimes enabled and spawns blocking tasks outside a
# Tokio runtime, which panics. Use the async-io runtime instead.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
tauri = { version = "2", features = [] }
toml = "1"

[profile.release]
lto = "thin"
strip = true
